<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>上班鼓励器 · 主题总览</title>
<style>
@font-face{font-family:"Noto Sans SC";font-weight:100 900;src:url("/fonts/noto-sans-sc.woff2") format("woff2")}
body{margin:0;background:#E4E1DA;font-family:"Noto Sans SC",sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,248px);gap:18px 14px;padding:22px 20px}
figure{margin:0}
.frame{width:248px;height:376px;overflow:hidden;border-radius:14px;box-shadow:0 1px 3px rgb(0 0 0/.12)}
iframe{width:620px;height:940px;border:0;transform:scale(.4);transform-origin:0 0}
figcaption{margin-top:8px;font-size:13px;color:#3A3732;text-align:center;letter-spacing:.08em}
</style></head><body><div class="grid" id="grid"></div>
<script type="module">
// Visual QA: every 主题 in light and dark, rendered by qa.html at the same frozen moment. ?color=<id>
import { STYLES } from '/src/themes.js';
const color = new URLSearchParams(location.search).get('color') || 'blue';
document.getElementById('grid').innerHTML = ['light', 'dark'].flatMap(appearance => STYLES.map(style => `<figure><div class="frame"><iframe src="/qa.html?theme=${style.id}&color=${color}&appearance=${appearance}" title="${style.name}"></iframe></div><figcaption>${style.name} · ${appearance === 'light' ? '浅色' : '深色'}</figcaption></figure>`)).join('');
</script></body></html>
